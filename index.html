<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK 3D - Учет пластика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::selection { background: #f97316; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-200 p-4 md:p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        
        <!-- Заголовок -->
        <div class="text-center mb-8 flex flex-col items-center">
            <div class="flex items-center gap-2 text-3xl font-bold uppercase tracking-wide">
                <span class="text-orange-500">GK</span> <span class="text-white">3D</span>
            </div>
            <p class="text-slate-500 mt-1 tracking-widest text-xs uppercase">Склад 3D пластика</p>
        </div>

        <!-- Статистика -->
        <div class="bg-slate-800 rounded-r-xl rounded-l-sm p-5 mb-6 border-l-4 border-orange-500 shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-lg text-white font-medium">Общая статистика</span>
            </div>
            <div class="space-y-3">
                <div class="bg-slate-900 rounded p-3 flex justify-between items-center border border-slate-700/50">
                    <span class="text-slate-300 font-medium">Всего пластика</span>
                    <span class="text-orange-500 font-bold text-xl"><span id="total-weight">0</span> кг</span>
                </div>
                <div class="bg-slate-900 rounded p-3 flex justify-between items-center border border-slate-700/50">
                    <span class="text-slate-300 font-medium">Общая стоимость</span>
                    <span class="text-orange-500 font-bold text-xl"><span id="total-cost">0</span> BYN</span>
                </div>
            </div>
        </div>

        <!-- Форма добавления -->
        <div class="bg-slate-800 rounded-r-xl rounded-l-sm p-5 mb-8 border-l-4 border-slate-600 shadow-lg opacity-90 hover:opacity-100 transition-opacity">
            <h2 class="text-sm text-slate-400 font-medium mb-4 uppercase tracking-wider">Пополнение склада</h2>
            <form id="add-form" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <select id="brand" class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-orange-500 w-full outline-none" required>
                        <option value="" disabled selected>Производитель</option>
                    </select>
                    <select id="type" class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-orange-500 w-full outline-none" required>
                        <option value="" disabled selected>Тип пластика</option>
                        <option value="PET GF">PET GF</option>
                        <option value="PETG CF">PETG CF</option>
                        <option value="PETG GF">PETG GF</option>
                        <option value="PETG">PETG</option>
                        <option value="PLA">PLA</option>
                        <option value="TPU">TPU</option>
                    </select>
                </div>
                <select id="color" class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-orange-500 w-full outline-none" required>
                    <option value="" disabled selected>Цвет</option>
                    <option value="Красный">🔴 Красный</option>
                    <option value="Оранжевый">🟠 Оранжевый</option>
                    <option value="Желтый">🟡 Желтый</option>
                    <option value="Зеленый">🟢 Зеленый</option>
                    <option value="Голубой">💧 Голубой</option>
                    <option value="Синий">🔵 Синий</option>
                    <option value="Фиолетовый">🟣 Фиолетовый</option>
                    <option value="Белый">⚪ Белый</option>
                    <option value="Серый">🔘 Серый</option>
                    <option value="Черный">⚫ Черный</option>
                </select>
                <div class="flex gap-3">
                    <input type="number" id="weight" placeholder="Вес (кг)" step="0.1" min="0" class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-orange-500 w-full outline-none" required>
                    <input type="number" id="price" placeholder="Цена (BYN)" step="0.1" min="0" class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-orange-500 w-full outline-none" required>
                    <button type="submit" class="bg-slate-700 text-white font-bold px-6 rounded hover:bg-orange-600 transition">
                        ВНЕСТИ
                    </button>
                </div>
            </form>
        </div>

        <!-- СКЛАД -->
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-px bg-slate-700 flex-1"></div>
                <h2 class="text-2xl text-white font-bold tracking-wide uppercase">В наличии</h2>
                <div class="h-px bg-slate-700 flex-1"></div>
            </div>
            
            <div id="inventory-list" class="space-y-6">
                <!-- Сюда добавляются сгруппированные списки -->
            </div>
        </div>

        <!-- Настройки (Бренды + Бэкап) -->
        <div class="bg-slate-800 rounded-r-xl rounded-l-sm p-5 border-l-4 border-slate-600 shadow-lg mb-8 opacity-80">
            <h2 class="text-sm text-slate-400 font-medium mb-4 uppercase tracking-wider">Настройки</h2>
            
            <form id="add-brand-form" class="flex gap-3 mb-4">
                <input type="text" id="new-brand-name" placeholder="Новый производитель..." class="bg-slate-900 text-slate-300 border-none p-3 rounded focus:ring-1 focus:ring-slate-500 w-full outline-none" required>
                <button type="submit" class="bg-slate-700 text-white font-bold px-4 rounded hover:bg-slate-600 transition">+</button>
            </form>
            <div id="brands-list" class="flex flex-wrap gap-2 mb-6"></div>

            <hr class="border-slate-700 mb-4">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button onclick="exportData()" class="bg-slate-900 text-slate-400 border border-slate-700 p-2 rounded hover:text-white hover:bg-slate-700 transition text-sm">
                    Экспорт (Бекап)
                </button>
                <label class="bg-slate-900 text-slate-400 border border-slate-700 p-2 rounded hover:text-white hover:bg-slate-700 transition text-sm text-center cursor-pointer">
                    Импорт данных
                    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
                </label>
                <!-- Добавлена кнопка жесткого сброса для отладки -->
                <button onclick="resetData()" class="bg-red-900/30 text-red-500 border border-red-900/50 p-2 rounded hover:text-white hover:bg-red-800 transition text-sm">
                    Сброс данных
                </button>
            </div>
        </div>

    </div>

    <script>
        // Безопасная загрузка данных (защита от краша при битом localStorage)
        let inventory = [];
        try {
            const savedInventory = localStorage.getItem('gk3d_inventory');
            if (savedInventory) {
                const parsed = JSON.parse(savedInventory);
                if (Array.isArray(parsed)) inventory = parsed;
            }
        } catch (e) {
            console.error("Ошибка чтения склада:", e);
        }

        let brands = ["U3PRINT", "Exoflex", "Star Plast", "Mako", "Plastiq"];
        try {
            const savedBrands = localStorage.getItem('gk3d_brands');
            if (savedBrands) {
                const parsed = JSON.parse(savedBrands);
                if (Array.isArray(parsed) && parsed.length > 0) brands = parsed;
            }
        } catch (e) {
            console.error("Ошибка чтения брендов:", e);
        }

        // Соответствие цветов
        const colorStyles = {
            'Красный': 'bg-red-500', 'Оранжевый': 'bg-orange-500', 'Желтый': 'bg-yellow-400',
            'Зеленый': 'bg-green-500', 'Голубой': 'bg-cyan-400', 'Синий': 'bg-blue-600',
            'Фиолетовый': 'bg-purple-500', 'Белый': 'bg-white', 'Серый': 'bg-gray-400', 'Черный': 'bg-black'
        };

        const form = document.getElementById('add-form');
        const inventoryList = document.getElementById('inventory-list');
        const brandSelect = document.getElementById('brand');
        
        function updateBrandsUI() {
            brandSelect.innerHTML = '<option value="" disabled selected>Производитель</option>';
            brands.forEach(b => brandSelect.innerHTML += `<option value="${b}">${b}</option>`);
            brandSelect.innerHTML += '<option value="Другой">Другой</option>';

            const brandsListContainer = document.getElementById('brands-list');
            brandsListContainer.innerHTML = '';
            brands.forEach((b, index) => {
                const chip = document.createElement('div');
                chip.className = 'flex items-center bg-slate-900 rounded px-3 py-1 text-xs text-slate-400';
                chip.innerHTML = `
                    <span>${b}</span>
                    <button type="button" onclick="deleteBrand(${index})" class="ml-2 text-slate-500 hover:text-red-500 focus:outline-none">&times;</button>
                `;
                brandsListContainer.appendChild(chip);
            });
            localStorage.setItem('gk3d_brands', JSON.stringify(brands));
        }

        document.getElementById('add-brand-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('new-brand-name');
            const val = input.value.trim();
            if (val && !brands.includes(val)) {
                brands.push(val);
                updateBrandsUI();
            }
            input.value = '';
        });

        window.deleteBrand = function(index) {
            if(confirm('Удалить производителя?')) { brands.splice(index, 1); updateBrandsUI(); }
        }

        function updateInventoryUI() {
            inventoryList.innerHTML = '';
            let totalWeight = 0; let totalCost = 0;

            inventory.forEach(item => {
                totalWeight += parseFloat(item.weight) || 0;
                totalCost += parseFloat(item.price) || 0;
            });

            document.getElementById('total-weight').textContent = totalWeight.toFixed(2);
            document.getElementById('total-cost').textContent = totalCost.toFixed(2);
            
            const grouped = inventory.reduce((acc, item) => {
                if (!acc[item.type]) acc[item.type] = [];
                acc[item.type].push(item);
                return acc;
            }, {});

            const sortedTypes = Object.keys(grouped).sort();

            if (sortedTypes.length === 0) {
                inventoryList.innerHTML = '<div class="text-slate-600 text-center py-8 border-2 border-dashed border-slate-800 rounded-xl">На складе пока нет катушек</div>';
            }

            sortedTypes.forEach(type => {
                const groupContainer = document.createElement('div');
                groupContainer.className = 'bg-slate-800/80 rounded-xl p-1 border border-slate-700 shadow-xl';
                
                const groupHeader = document.createElement('div');
                groupHeader.className = 'bg-slate-800 text-orange-500 font-black text-xl px-5 py-3 rounded-t-lg tracking-widest';
                groupHeader.textContent = type;
                groupContainer.appendChild(groupHeader);

                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'flex flex-col gap-1 px-1 pb-1';

                grouped[type].forEach(item => {
                    const bgDotColor = colorStyles[item.color] || 'bg-slate-500';
                    const itemEl = document.createElement('div');
                    itemEl.className = 'flex justify-between items-center bg-slate-900 p-4 rounded-lg hover:bg-slate-800 transition group';
                    itemEl.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-5 h-5 rounded-full shadow-inner ring-2 ring-slate-700 ${bgDotColor}"></div>
                            <div class="flex flex-col">
                                <span class="text-white font-bold text-lg leading-none">${item.brand}</span>
                                <span class="text-xs text-slate-500 mt-1.5 opacity-0 group-hover:opacity-100 transition cursor-pointer hover:text-red-500 uppercase tracking-wider" onclick="deleteInventoryItem(${item.id})">Списать катушку</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <div class="text-slate-400 text-xs uppercase tracking-widest mb-1">Остаток</div>
                                <div class="bg-[#0b0f19] px-3 py-1 rounded text-orange-500 font-black text-lg border border-slate-700 shadow-inner">
                                    ${item.weight} <span class="text-sm font-normal text-slate-500">кг</span>
                                </div>
                            </div>
                        </div>
                    `;
                    itemsContainer.appendChild(itemEl);
                });

                groupContainer.appendChild(itemsContainer);
                inventoryList.appendChild(groupContainer);
            });

            localStorage.setItem('gk3d_inventory', JSON.stringify(inventory));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            inventory.push({
                id: Date.now(),
                brand: document.getElementById('brand').value,
                type: document.getElementById('type').value,
                color: document.getElementById('color').value,
                weight: document.getElementById('weight').value,
                price: document.getElementById('price').value
            });
            updateInventoryUI();
            form.reset();
            document.getElementById('brand').value = "";
            document.getElementById('type').value = "";
            document.getElementById('color').value = "";
        });

        window.deleteInventoryItem = function(id) {
            if(confirm('Удалить эту катушку со склада?')) {
                inventory = inventory.filter(item => item.id !== id);
                updateInventoryUI();
            }
        }

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ inventory, brands }));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "gk3d_backup.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.inventory && data.brands) {
                        inventory = data.inventory; brands = data.brands;
                        updateBrandsUI(); updateInventoryUI();
                        alert('Данные успешно загружены!');
                    } else {
                        alert('Неверный формат файла резервной копии.');
                    }
                } catch(err) { alert('Ошибка при чтении файла.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Жесткий сброс для исправления ошибок LocalStorage
        window.resetData = function() {
            if(confirm('ВНИМАНИЕ! Это действие удалит все данные со склада и сбросит список производителей. Продолжить?')) {
                localStorage.removeItem('gk3d_inventory');
                localStorage.removeItem('gk3d_brands');
                location.reload();
            }
        }

        // Первичный запуск
        updateBrandsUI();
        updateInventoryUI();
    </script>
</body>
</html>
